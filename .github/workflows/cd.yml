name: CD — Streamlit Cloud

on:
  push:
    branches:
      - main

jobs:
  notify:
    name: Notify deploy
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Streamlit Cloud reboot
        # Streamlit Cloud automatically redeploys when main branch is updated.
        # This step just confirms the push reached CI/CD.
        # Optional: add STREAMLIT_DEPLOY_HOOK secret if you use a custom webhook.
        run: echo "✅ Pushed to main — Streamlit Cloud will auto-redeploy."
