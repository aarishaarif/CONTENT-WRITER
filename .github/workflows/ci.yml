name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ──────────────────────────────────────────────
  # Backend: lint + test (Python / FastAPI)
  # ──────────────────────────────────────────────
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev / lint tools
        run: pip install ruff==0.4.4 pytest==8.2.2 httpx==0.27.0 pytest-asyncio==0.23.7

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests
        # Skip model loading during CI by mocking it out (see test_main.py)
        env:
          CI: "true"
        run: pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────
  # Frontend: install + build (React / Vite)
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend — build check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Provide a placeholder so Vite doesn't error on missing env var
          VITE_API_URL: https://placeholder.onrender.com
        run: npm run build
